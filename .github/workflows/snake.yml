name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: StevBeq
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#3f3f46&color_dots=#f4f4f5,#d4d4d8,#a1a1aa,#71717a,#3f3f46
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f4f4f5&color_dots=#18181b,#3f3f46,#71717a,#a1a1aa,#e4e4e7

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
